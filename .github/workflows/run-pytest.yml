# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Test with PyTest

on:
  push:
    branches: [ autotest ]
  pull_request:
    branches: [ master ]

env:
  DATA_DST: data/胶质瘤20220609.xlsx

jobs:
  build:

    runs-on: ubuntu-22.04
    strategy:
      matrix:
        # scikit-learn 1.9 / xgboost-cpu 3.4 require Python >= 3.12
        python-version: ["3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install -r requirements.txt
        python -m pip install pytest pytest-xdist # Testing packages
        python -m pip freeze
    - name: Download secret data
      env:
        DATA_URL: ${{ secrets.DATA_STORAGE_PLACE_AND_PASSWORD }}
        DATA_MD5: 60559f5a05aa6fde52d1978882d85227
      run: |
        # The MEGA link embeds the decryption key, so the URL is stored in a
        # GitHub repository secret and resolved at runtime — never commit it.
        # mega.nz links are not plain HTTP downloads (a bare curl/wget returns
        # an HTML page) and megatools no longer works; fetch via the MEGA API
        # directly with mega_download.py (requests + pycryptodome, no MEGA
        # account needed).
        pip install -q pycryptodome
        python - <<'EOF'
        import os
        from pathlib import Path

        from mega_download import mega_download

        url = os.environ.get("DATA_URL", "")
        if not url:
            raise SystemExit(
                "DATA_STORAGE_PLACE_AND_PASSWORD secret not set — cannot download dataset."
            )
        dst = Path(os.environ["DATA_DST"])  # data/胶质瘤20220609.xlsx
        dst.parent.mkdir(parents=True, exist_ok=True)
        # a single xlsx file, not an archive -> extract=False
        mega_download(url, dst.parent, extract=False, md5=os.environ.get("DATA_MD5") or None)
        # mega_download names the file after the MEGA-stored filename; make
        # sure it lands at DATA_DST even if that name differs
        if not dst.exists():
            candidates = list(dst.parent.glob("*.xlsx"))
            if len(candidates) == 1:
                candidates[0].rename(dst)
            else:
                raise SystemExit(f"expected {dst} after download, found {candidates or 'nothing'}")
        print("dataset ready:", dst, dst.stat().st_size, "bytes")
        EOF
    - name: Test with pytest
      run: |
        DEBUG_MODE=1 pytest -vv -s test.py
