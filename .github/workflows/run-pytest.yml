# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Test with PyTest

on:
  push:
    branches: [ autotest ]
  pull_request:
    branches: [ master ]

env:
  DATA_DST: data/胶质瘤20220609.xlsx

jobs:
  build:

    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install -r requirements.txt
        python -m pip install pytest pytest-xdist # Testing packages
        python -m pip freeze
    - name: Download secret data
      uses: gacts/run-and-post-run@v1
      with:
        run: |
          # MEGA file links embed the decryption key, so the URL is stored in a
          # GitHub repository secret and resolved at runtime — never commit it.
          # megadl (megatools) is used because mega.nz/file links are not plain
          # HTTP downloads (a bare curl/wget returns an HTML page).
          DATA_URL="${{ secrets.DATA_STORAGE_PLACE_AND_PASSWORD }}"
          if [ -z "$DATA_URL" ]; then
            echo "DATA_STORAGE_PLACE_AND_PASSWORD secret not set — cannot download dataset."
            exit 1
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq megatools
          mkdir -p "$(dirname ${{ env.DATA_DST }})"
          megadl --path ${{ env.DATA_DST }} "$DATA_URL"
        post: |
          if [ -f ${{ env.DATA_DST }} ]; then
            rm ${{ env.DATA_DST }}
          fi
    - name: Test with pytest
      run: |
        DEBUG_MODE=1 pytest -vv -s test.py
